services:
  # --- Object storage backend for the pipeline ---
  minio:
    image: minio/minio:RELEASE.2023-05-04T21-44-30Z
    ports:
      - "9105:9000"  # S3 API
      - "9106:9001"  # Web console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    # Downstream services (create-buckets) wait on this healthcheck
    # rather than a fixed sleep, avoids race conditions on cold start.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- One-shot init job: provisions buckets, then exits ---
  # Not a long-running service; depends_on condition ensures it only
  # runs once minio is actually ready to accept connections.
  create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing myminio/retail-footfall-pipeline;
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001;
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001/${FILE_PATH_RAW_DATA};
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001/${FILE_PATH_INTER_DATA};
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001/${FILE_PATH_PRO_DATA};
      exit 0;
      "

  # --- Mock external provider API ---
  store-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      # Build args come from .env; see .env.example for required keys.
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        APP_PORT: ${APP_PORT}
    container_name: store-api
    # Runtime env, distinct from build args above.
    environment:
      APP_PORT: ${APP_PORT}
    # HOST_PORT is separate from APP_PORT so multiple instances
    # can run side by side by overriding HOST_PORT only.
    ports:
      - "${HOST_PORT}:${APP_PORT}"
    networks:
      - default

  # --- Airflow metadata database ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Downstream airflow-init waits on this healthcheck rather than
    # a fixed sleep, same pattern as minio above.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  # --- One-shot init job: migrates the DB and creates the admin user, then exits ---
  # Not a long-running service; depends_on conditions ensure it only
  # runs once postgres AND minio are actually ready.
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Gabriel --lastname Surier --role Admin --email ${AIRFLOW_ADMIN_EMAIL}"
    networks:
      - default

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
        AIRFLOW_PORT: ${AIRFLOW_PORT}
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    ports:
      - "${AIRFLOW_PORT}:${AIRFLOW_PORT}"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./src:/opt/airflow/src
    command: webserver
    networks:
      - default

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./src:/opt/airflow/src
    command: scheduler
    networks:
      - default

volumes:
  minio_data:
  postgres_data:

networks:
  default:
    driver: bridge