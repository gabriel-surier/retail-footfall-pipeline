services:
  minio:
    image: minio/minio:RELEASE.2023-05-04T21-44-30Z
    ports:
      - "9105:9000"
      - "9106:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing myminio/retail-footfall-pipeline;
      mc mb --ignore-existing myminio/retail-footfall-pipeline/${FILE_PATH_RAW_DATA};
      mc mb --ignore-existing myminio/retail-footfall-pipeline/${FILE_PATH_INTER_DATA};
      mc mb --ignore-existing myminio/retail-footfall-pipeline/${FILE_PATH_PRO_DATA};
      exit 0;
      "
volumes:
  minio_data: