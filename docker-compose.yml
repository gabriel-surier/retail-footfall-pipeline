services:
  # --- Object storage backend for the pipeline ---
  minio:
    image: minio/minio:RELEASE.2023-05-04T21-44-30Z
    ports:
      - "9105:9000"  # S3 API
      - "9106:9001"  # Web console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- One-shot init job: provisions buckets, then exits ---
  create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing myminio/retail-footfall-pipeline;
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001;
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001/${FILE_PATH_RAW_DATA};
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001/${FILE_PATH_INTER_DATA};
      mc mb --ignore-existing myminio/retail-footfall-pipeline/rfp_fl001/${FILE_PATH_PRO_DATA};
      exit 0;
      "
    networks:
        - default

  # --- Mock external provider API ---
  store-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        APP_PORT: ${APP_PORT}
    container_name: store-api
    environment:
      APP_PORT: ${APP_PORT}
    ports:
      - "${HOST_PORT}:${APP_PORT}"
    networks:
      - default

  # --- ETL image: NOT a long-running service. Built once (or on every ETL
  # code change) and tagged, then instantiated on demand by the scheduler's
  # DockerOperator. The "build-only" profile is never activated by a plain
  # `docker compose up`, so this never starts as a standing container.
  # Rebuild explicitly with: docker compose --profile build-only build etl-image
  etl-rfp:
    build:
      context: .
      dockerfile: etl/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    image: retail-footfall-etl:latest
    profiles: ["build-only"]
    env_file:
      - .env

  # --- Airflow metadata database ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  # --- One-shot init job: migrates the DB, then exits ---
  # NOTE: no `airflow users create` here — Airflow 3 defaults to SimpleAuthManager,
  # which doesn't support that CLI. AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS below
  # sets the username/role; the password is auto-generated and printed in
  # `docker logs api-server` on first start.
  airflow-init:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    entrypoint: /bin/bash
    command: -c "airflow db migrate"
    env_file:
      - .env_docker
    networks:
      - default

  # --- Airflow API server / UI ---
  # No docker.sock mount here: with LocalExecutor, task execution happens
  # on the scheduler, not here. This container only serves the UI/API.
  # No ./etl or ./src volumes either: ETL code now lives exclusively in
  # the separate etl-image, never inside the Airflow containers.
  api-server:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
        AIRFLOW_PORT: ${AIRFLOW_PORT}
    container_name: api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:${AIRFLOW_PORT}/execution/
      AIRFLOW__API__PORT: ${AIRFLOW_PORT}
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    ports:
      - "${AIRFLOW_PORT}:${AIRFLOW_PORT}"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/logs:/opt/airflow/logs
    command: api-server
    env_file:
      - .env_docker
    networks:
      - default

  # --- Airflow scheduler ---
  # docker.sock is mounted here (Docker-outside-of-Docker): with
  # LocalExecutor, the scheduler is the process that actually runs task
  # instances, so it's the one that needs to launch the ETL container via
  # DockerOperator. Still no ./etl or ./src volumes: the scheduler only
  # invokes the etl-image by name/tag, it never imports or runs ETL code
  # itself.
  airflow-scheduler:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:${AIRFLOW_PORT}/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    env_file:
      - .env_docker
    networks:
      - default

  # --- Required in Airflow 3: DAG parsing is a separate, mandatory component,
  # no longer handled by the scheduler itself.
  # Only parses the DAG .py files (which just declare DockerOperator tasks),
  # so no ./etl, ./src, or docker.sock needed here either.
  airflow-dag-processor:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/logs:/opt/airflow/logs
    command: dag-processor
    env_file:
      - .env_docker
    networks:
      - default

volumes:
  minio_data:
  postgres_data:

networks:
  # Named explicitly (rather than left to Compose's default
  # "<project>_default" naming) so the DockerOperator's network_mode in
  # the DAG stays stable regardless of the folder name the repo is
  # cloned into on the VPS.
  default:
    name: rfp-net
    driver: bridge